name: Sync GestaoClick -> ClickUp
on:
  schedule:
    - cron: "7,37 11-22 * * 1-5"   # 7 e 37 min, 08h-19h Brasilia (11-22 UTC), seg-sex
  workflow_dispatch: {}            # permite rodar manualmente pelo botao "Run workflow"
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run sync:once
        env:
          GC_ACCESS_TOKEN: ${{ secrets.GC_ACCESS_TOKEN }}
          GC_SECRET_TOKEN: ${{ secrets.GC_SECRET_TOKEN }}
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_LIST_AVULSO: "901327620288"
          CLICKUP_LIST_CPFL: "901327620289"
          CLICKUP_LIST_NEOENERGIA: "901327620291"
          CLICKUP_LIST_CONECTA: "901327705932"
          GC_CENTRO_CUSTO_MAP: ""
          INITIAL_STATUS: "to do"
          LOOKBACK_DAYS: "3"
          RUN_ONCE: "true"
 

# NOTA sobre minutos gratis:
# - Repo privado: ~2000 min/mes gratis. A cada 30 min costuma encostar no limite;
#   se quiser folga total, troque o cron para "0 * * * *" (de hora em hora).
# - Repo publico: minutos ilimitados/gratis em qualquer cadencia.
